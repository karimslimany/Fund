name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP if present
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            mkdir -p temp_ext
            unzip -o "$ZIP_FILE" -d temp_ext
            if [ -f temp_ext/settings.gradle.kts ] || [ -f temp_ext/settings.gradle ]; then
              cp -rn temp_ext/* .
            else
              SUBDIR=$(find temp_ext -mindepth 1 -maxdepth 1 -type d | head -n 1)
              if [ -n "$SUBDIR" ]; then
                cp -rn "$SUBDIR"/* .
              fi
            fi
            rm -rf temp_ext
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create dummy env files
        run: |
          echo "GEMINI_API_KEY=dummy_key" > .env
          echo "GEMINI_API_KEY=dummy_key" > .env.example

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"

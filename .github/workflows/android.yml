name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP if present
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            mkdir -p temp_ext
            unzip -o "$ZIP_FILE" -d temp_ext
            if [ -f temp_ext/settings.gradle.kts ] || [ -f temp_ext/settings.gradle ]; then
              cp -rn temp_ext/* .
            else
              SUBDIR=$(find temp_ext -mindepth 1 -maxdepth 1 -type d | head -n 1)
              if [ -n "$SUBDIR" ]; then
                cp -rn "$SUBDIR"/* .
              fi
            fi
            rm -rf temp_ext
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create dummy env files
        run: |
          echo "GEMINI_API_KEY=dummy_key" > .env
          echo "GEMINI_API_KEY=dummy_key" > .env.example

      - name: Strip Null Bytes, UTF-16 Conversion & Cleaning
        run: |
          python3 - << 'EOF'
          import glob, unicodedata, re

          files = glob.glob('**/*.gradle.kts', recursive=True) + \
                  glob.glob('**/*.gradle', recursive=True) + \
                  glob.glob('**/*.toml', recursive=True)

          for path in files:
              try:
                  with open(path, 'rb') as f:
                      raw = f.read()

                  # Detect UTF-16 encoding or null bytes
                  if b'\x00' in raw:
                      try:
                          content = raw.decode('utf-16')
                      except Exception:
                          content = raw.decode('utf-8', errors='ignore').replace('\x00', '')
                  else:
                      content = raw.decode('utf-8', errors='ignore')

                  # Remove any remaining null bytes
                  content = content.replace('\x00', '')

                  # Standardize Unicode characters
                  content = unicodedata.normalize('NFKC', content)

                  # Remove hidden zero-width characters and BOM
                  content = re.sub(r'[\u200b-\u200d\ufeff]', '', content)

                  # Replace non-standard unicode whitespace with standard space
                  content = re.sub(r'[\u00a0\u1680\u180e\u2000-\u200a\u202f\u205f\u3000]', ' ', content)

                  # Fix non-standard quotes
                  content = content.replace('“', '"').replace('”', '"').replace('‘', "'").replace('’', "'")

                  lines = content.splitlines()
                  fixed = []
                  for line in lines:
                      if 'signingConfig' in line and not line.strip().startswith('//'):
                          fixed.append('// ' + line)
                      else:
                          fixed.append(line)

                  result = '\n'.join(fixed) + '\n'
                  with open(path, 'wb') as f:
                      f.write(result.encode('utf-8'))
                  print(f'Successfully fixed encoding: {path}')
              except Exception as e:
                  print(f'Error processing {path}: {e}')
          EOF

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"


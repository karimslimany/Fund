name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP if present
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            mkdir -p temp_ext
            unzip -o "$ZIP_FILE" -d temp_ext
            if [ -f temp_ext/settings.gradle.kts ] || [ -f temp_ext/settings.gradle ]; then
              cp -rn temp_ext/* .
            else
              SUBDIR=$(find temp_ext -mindepth 1 -maxdepth 1 -type d | head -n 1)
              if [ -n "$SUBDIR" ]; then
                cp -rn "$SUBDIR"/* .
              fi
            fi
            rm -rf temp_ext
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create dummy env files
        run: |
          echo "GEMINI_API_KEY=dummy_key" > .env
          echo "GEMINI_API_KEY=dummy_key" > .env.example

      - name: Clean Gradle files and remove signingConfig
        run: |
          python3 - << 'EOF'
          import glob

          for path in glob.glob('**/*.gradle.kts', recursive=True) + glob.glob('**/*.gradle', recursive=True):
              try:
                  with open(path, 'rb') as f:
                      raw = f.read()
                  text = raw.decode('utf-8', errors='ignore')
                  
                  # Clean invalid unicode, non-breaking spaces (NBSP), BOM, and smart quotes
                  text = text.replace('\ufeff', '')
                  text = text.replace('\u00a0', ' ')
                  text = text.replace('\xa0', ' ')
                  text = text.replace('\u200b', '')
                  text = text.replace('\u202f', ' ')
                  text = text.replace('“', '"').replace('”', '"').replace('‘', "'").replace('’', "'")
                  
                  lines = text.splitlines()
                  fixed = []
                  for line in lines:
                      if 'signingConfig' in line and not line.strip().startswith('//'):
                          fixed.append('// ' + line)
                      else:
                          fixed.append(line)
                  
                  content = '\n'.join(fixed) + '\n'
                  with open(path, 'wb') as f:
                      f.write(content.encode('utf-8'))
                  print(f'Successfully cleaned: {path}')
              except Exception as e:
                  print(f'Error processing {path}: {e}')
          EOF

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
